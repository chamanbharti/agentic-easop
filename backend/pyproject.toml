[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easop-api"
version = "0.1.0"
description = "Enterprise Agentic AI Service Operations Platform API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "pydantic>=2,<3",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
    "mypy",
    "build",
    "pip-tools",
    "setuptools>=68",
    "wheel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]